[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steering-denoising"
version = "0.1.0"
description = "Reproducible activation-denoising experiments for language-model steering."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.2,<3",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
lm = [
    "datasets>=3,<5",
    "huggingface-hub>=0.25,<2",
    "safetensors>=0.4,<1",
    "transformers>=4.45,<6",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
steerlab = "steering_denoising.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
